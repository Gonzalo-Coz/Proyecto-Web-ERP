monolog:
    channels:
        - deprecation
        - security_events # accesos, sesiones (§23.12)
        - business        # compras, ventas, inventario, caja (§23.12)
        - sunat           # comunicación con SUNAT (§23.12)

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event', '!deprecation']
            business:
                type: stream
                path: '%kernel.logs_dir%/business.log'
                level: info
                channels: ['business', 'sunat', 'security_events']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                channels: ['!event']
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                buffer_size: 50
            nested:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: info
                max_files: 30
            business:
                type: rotating_file
                path: '%kernel.logs_dir%/business.log'
                level: info
                max_files: 90
                channels: ['business', 'sunat', 'security_events']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine']
