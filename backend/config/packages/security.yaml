security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # NOTA: el provider apuntará a App\Module\Security\Entity\User cuando se
    # implemente el módulo de Seguridad (Fase 0, parte 2). Mientras tanto se
    # usa un provider en memoria vacío para que el kernel arranque.
    providers:
        app_users:
            memory: { users: {} }

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_docs:
            pattern: ^/api/docs
            security: false

        api:
            pattern: ^/api
            stateless: true
            # Se activará al implementar autenticación JWT:
            # provider: app_users
            # jwt: ~
            security: false

    access_control:
        # Se definirá al activar JWT:
        # - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        # - { path: ^/api/v1/health, roles: PUBLIC_ACCESS }
        # - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
