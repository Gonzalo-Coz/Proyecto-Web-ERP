security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Module\Security\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_docs:
            pattern: ^/api/docs
            security: false

        # Login: recibe {username, password} y devuelve el JWT + datos del usuario
        login:
            pattern: ^/api/v1/auth/login$
            stateless: true
            provider: app_users
            user_checker: App\Module\Security\Security\ActiveUserChecker
            json_login:
                check_path: /api/v1/auth/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Resto de la API: autenticación por token JWT en cada petición
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            user_checker: App\Module\Security\Security\ActiveUserChecker
            jwt: ~

    access_control:
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/health, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
