; Ajustes de php-fpm para Railway.
; El log de accesos va a stdout (fd 1) para que Railway NO lo marque como
; "error" (todo lo que va a stderr se clasifica como error). Los errores
; reales siguen yendo a stderr.
[global]
; Silencia el "access log" duplicado del master; los accesos los emite el pool.
[www]
access.log = /proc/self/fd/1
catch_workers_output = yes
decorate_workers_output = no

; Pool de procesos: por defecto php-fpm solo permite 5 peticiones PHP en paralelo,
; lo que encola las demás y causa lentitud cuando varios usuarios usan el sistema
; o una pantalla dispara varias llamadas a la API a la vez (p. ej. el dashboard).
; Se sube de 5 a 10 (cada worker ~40-60 MB → ~600 MB en el peor caso). Si tu plan de
; Railway tiene 1 GB+ puedes subir pm.max_children a 16-20; si ves errores de memoria
; (OOM), bájalo. pm=dynamic solo crea procesos bajo demanda, no todos de golpe.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
