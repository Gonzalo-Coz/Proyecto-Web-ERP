; Ajustes de php-fpm para Railway.
; El log de accesos va a stdout (fd 1) para que Railway NO lo marque como
; "error" (todo lo que va a stderr se clasifica como error). Los errores
; reales siguen yendo a stderr.
[global]
; Silencia el "access log" duplicado del master; los accesos los emite el pool.
[www]
access.log = /proc/self/fd/1
catch_workers_output = yes
decorate_workers_output = no
