; Ajustes de rendimiento de PHP para producción (Railway).
; opcache cachea el bytecode compilado de PHP; con Symfony en prod conviene
; subir memoria y número de archivos, y desactivar la revalidación por timestamp
; (el código no cambia en caliente dentro del contenedor, solo en cada deploy).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1

; realpath cache grande: Symfony abre muchos archivos; esto evita stats repetidos.
realpath_cache_size=4096K
realpath_cache_ttl=600

; Límite de memoria por proceso (suficiente para la app y PhpSpreadsheet).
memory_limit=256M
